<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>荷物追跡</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+JP:wght@300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f7f7f5;
      --surface: #ffffff;
      --border: #e0e0dc;
      --border-dark: #222;
      --text: #111;
      --text-muted: #999;
      --accent: #111;
      --radius: 8px;
      --radius-sm: 5px;
      --undo-bg: #111;
      --undo-text: #fff;
    }

    body {
      font-family: 'Noto Sans JP', sans-serif;
      font-weight: 300;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 48px 16px 64px;
      color: var(--text);
    }

    .container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* Header */
    .header {
      text-align: center;
    }
    .header h1 {
      font-family: 'DM Mono', monospace;
      font-size: 1.1rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text);
    }
    .header p {
      margin-top: 6px;
      font-size: 0.75rem;
      color: var(--text-muted);
      letter-spacing: 0.02em;
    }

    /* Card */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Input */
    .input-wrap {
      position: relative;
    }
    input[type="text"] {
      width: 100%;
      padding: 12px 14px;
      font-size: 0.95rem;
      font-family: 'DM Mono', monospace;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--bg);
      color: var(--text);
      outline: none;
      transition: border-color 0.15s;
      letter-spacing: 0.04em;
    }
    input[type="text"]:focus {
      border-color: var(--border-dark);
    }
    input[type="text"]::placeholder {
      color: var(--text-muted);
      font-size: 0.82rem;
      letter-spacing: 0.02em;
    }

    /* Button grid */
    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .btn-grid .btn-full {
      grid-column: 1 / -1;
    }

    .track-btn {
      padding: 11px 10px;
      font-size: 0.82rem;
      font-family: 'Noto Sans JP', sans-serif;
      font-weight: 400;
      letter-spacing: 0.04em;
      border: 1.5px solid var(--border-dark);
      border-radius: var(--radius-sm);
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      transition: background 0.13s, color 0.13s;
      white-space: nowrap;
    }
    .track-btn:hover {
      background: var(--accent);
      color: #fff;
    }
    .track-btn:active {
      transform: scale(0.97);
    }
    .track-btn:disabled {
      border-color: var(--border);
      color: var(--text-muted);
      cursor: not-allowed;
      background: var(--surface);
    }
    .track-btn:disabled:hover {
      background: var(--surface);
      color: var(--text-muted);
    }

    /* Section label */
    .section-label {
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
      font-family: 'DM Mono', monospace;
    }

    /* History */
    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .clear-all-btn {
      font-size: 0.72rem;
      font-family: 'DM Mono', monospace;
      color: var(--text-muted);
      background: none;
      border: none;
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 2px;
      padding: 0;
      transition: color 0.13s;
    }
    .clear-all-btn:hover { color: var(--text); }
    .clear-all-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    #historyList {
      list-style: none;
      max-height: 220px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }

    .history-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: var(--radius-sm);
      border: 1px solid transparent;
      transition: border-color 0.13s, background 0.13s;
      min-height: 40px;
    }
    .history-item:hover {
      background: var(--bg);
      border-color: var(--border);
    }

    .history-number {
      flex: 1;
      font-family: 'DM Mono', monospace;
      font-size: 0.85rem;
      color: var(--text);
      cursor: pointer;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      letter-spacing: 0.04em;
    }

    /* Delete button as bordered square */
    .delete-btn {
      flex-shrink: 0;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface);
      color: var(--text-muted);
      cursor: pointer;
      transition: background 0.13s, color 0.13s, border-color 0.13s;
      line-height: 1;
    }
    .delete-btn:hover {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    /* Inline confirm */
    .confirm-row {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 1;
    }
    .confirm-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      white-space: nowrap;
    }
    .confirm-yes, .confirm-no {
      font-size: 0.72rem;
      font-family: 'DM Mono', monospace;
      padding: 3px 8px;
      border-radius: 4px;
      cursor: pointer;
      border: 1.5px solid;
      transition: background 0.12s, color 0.12s;
    }
    .confirm-yes {
      border-color: var(--border-dark);
      background: var(--surface);
      color: var(--text);
    }
    .confirm-yes:hover {
      background: var(--accent);
      color: #fff;
    }
    .confirm-no {
      border-color: var(--border);
      background: var(--surface);
      color: var(--text-muted);
    }
    .confirm-no:hover {
      border-color: var(--border-dark);
      color: var(--text);
    }

    /* Undo toast */
    #undoToast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--undo-bg);
      color: var(--undo-text);
      padding: 10px 18px;
      border-radius: var(--radius);
      font-size: 0.8rem;
      font-family: 'DM Mono', monospace;
      display: flex;
      align-items: center;
      gap: 14px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
      white-space: nowrap;
      z-index: 100;
    }
    #undoToast.show {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(-50%) translateY(0);
    }
    #undoBtn {
      background: none;
      border: 1px solid rgba(255,255,255,0.4);
      color: #fff;
      font-family: 'DM Mono', monospace;
      font-size: 0.75rem;
      padding: 3px 9px;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.12s;
    }
    #undoBtn:hover { background: rgba(255,255,255,0.15); }

    /* Clear all confirm bar */
    #clearConfirmBar {
      display: none;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 0.75rem;
      color: var(--text-muted);
    }
    #clearConfirmBar.visible { display: flex; }
    #clearConfirmBar .spacer { flex: 1; }

    @media (max-width: 480px) {
      body { padding: 28px 12px 80px; }
    }
  </style>
</head>
<body>
<div class="container">

  <div class="header">
    <h1>荷物追跡</h1>
    <p>ヤマト・佐川・日本郵便・Parcels・AliExpress</p>
  </div>

  <div class="card">
    <input type="text" id="trackingNumber" placeholder="追跡番号を入力" autocomplete="off" />

    <div class="btn-grid">
      <button class="track-btn" id="yamatoBtn">ヤマト運輸</button>
      <button class="track-btn" id="sagawaBtn">佐川急便</button>
      <button class="track-btn" id="jpPostBtn">日本郵便</button>
      <button class="track-btn" id="aliexpressBtn">AliExpress</button>
      <button class="track-btn btn-full" id="universalBtn">Parcels</button>
    </div>
  </div>

  <div class="card">
    <div class="history-header">
      <span class="section-label">履歴</span>
      <button class="clear-all-btn" id="clearAllBtn">全削除</button>
    </div>

    <div id="clearConfirmBar">
      <span>全履歴を削除しますか？</span>
      <span class="spacer"></span>
      <button class="confirm-yes" id="clearConfirmYes">削除</button>
      <button class="confirm-no" id="clearConfirmNo">キャンセル</button>
    </div>

    <ul id="historyList"></ul>
  </div>

</div>

<!-- Undo Toast -->
<div id="undoToast">
  <span id="undoMessage">削除しました</span>
  <button id="undoBtn">元に戻す</button>
</div>

<script>
  const input = document.getElementById("trackingNumber");
  const historyList = document.getElementById("historyList");
  const clearAllBtn = document.getElementById("clearAllBtn");
  const clearConfirmBar = document.getElementById("clearConfirmBar");
  const clearConfirmYes = document.getElementById("clearConfirmYes");
  const clearConfirmNo = document.getElementById("clearConfirmNo");
  const undoToast = document.getElementById("undoToast");
  const undoMessage = document.getElementById("undoMessage");
  const undoBtn = document.getElementById("undoBtn");

  let undoStack = null; // { type: 'single'|'all', data: [...] }
  let undoTimer = null;
  let hasEdited = false;

  // Init: prefill with latest
  const init = getHistory();
  if (init.length > 0) input.value = init[0];
  input.addEventListener("focus", () => {
    if (!hasEdited) { input.value = ""; hasEdited = true; }
  });

  function getHistory() {
    try { return JSON.parse(localStorage.getItem("trackingHistory")) || []; }
    catch { return []; }
  }
  function saveHistory(h) {
    localStorage.setItem("trackingHistory", JSON.stringify(h.slice(0, 10)));
  }
  function addToHistory(num) {
    num = num.trim();
    if (!num) return;
    let h = getHistory().filter(n => n !== num);
    h.unshift(num);
    saveHistory(h);
    renderHistory();
  }

  // --- Render ---
  function renderHistory() {
    const history = getHistory();
    historyList.innerHTML = "";
    clearAllBtn.disabled = history.length === 0;

    history.forEach(num => {
      const li = document.createElement("li");
      li.className = "history-item";
      li.dataset.num = num;

      const numDiv = document.createElement("div");
      numDiv.className = "history-number";
      numDiv.textContent = num;
      numDiv.title = num;
      numDiv.addEventListener("click", () => {
        input.value = num;
        hasEdited = true;
      });

      const delBtn = document.createElement("button");
      delBtn.className = "delete-btn";
      delBtn.textContent = "×";
      delBtn.title = "削除";
      delBtn.addEventListener("click", () => startDeleteConfirm(li, num));

      li.appendChild(numDiv);
      li.appendChild(delBtn);
      historyList.appendChild(li);
    });
  }

  // --- Single delete with confirm ---
  function startDeleteConfirm(li, num) {
    // Remove any existing confirm rows
    document.querySelectorAll(".confirm-row").forEach(el => {
      const parentLi = el.closest("li");
      if (parentLi) restoreItem(parentLi);
    });

    // Replace contents with confirm UI
    li.innerHTML = "";

    const row = document.createElement("div");
    row.className = "confirm-row";

    const label = document.createElement("span");
    label.className = "confirm-label";
    label.textContent = "削除しますか？";

    const yes = document.createElement("button");
    yes.className = "confirm-yes";
    yes.textContent = "削除";
    yes.addEventListener("click", () => doDeleteSingle(num));

    const no = document.createElement("button");
    no.className = "confirm-no";
    no.textContent = "キャンセル";
    no.addEventListener("click", () => {
      renderHistory();
    });

    row.appendChild(label);
    row.appendChild(yes);
    row.appendChild(no);
    li.appendChild(row);
  }

  function restoreItem(li) {
    renderHistory();
  }

  function doDeleteSingle(num) {
    const prev = getHistory();
    const next = prev.filter(n => n !== num);
    saveHistory(next);
    renderHistory();
    showUndo('single', prev, `「${num.slice(0, 12)}…」を削除しました`);
  }

  // --- Clear all with confirm ---
  clearAllBtn.addEventListener("click", () => {
    clearConfirmBar.classList.add("visible");
    clearAllBtn.disabled = true;
  });
  clearConfirmNo.addEventListener("click", () => {
    clearConfirmBar.classList.remove("visible");
    clearAllBtn.disabled = getHistory().length === 0;
  });
  clearConfirmYes.addEventListener("click", () => {
    const prev = getHistory();
    localStorage.removeItem("trackingHistory");
    clearConfirmBar.classList.remove("visible");
    renderHistory();
    showUndo('all', prev, "全履歴を削除しました");
  });

  // --- Undo toast ---
  function showUndo(type, prevData, message) {
    if (undoTimer) clearTimeout(undoTimer);
    undoStack = { type, data: prevData };
    undoMessage.textContent = message;
    undoToast.classList.add("show");
    undoTimer = setTimeout(() => {
      undoToast.classList.remove("show");
      undoStack = null;
    }, 5000);
  }

  undoBtn.addEventListener("click", () => {
    if (!undoStack) return;
    saveHistory(undoStack.data);
    undoStack = null;
    clearTimeout(undoTimer);
    undoToast.classList.remove("show");
    renderHistory();
  });

  // --- Tracking buttons ---
  function openUrl(url) { window.open(url, "_blank"); }
  function validate() {
    if (!input.value.trim()) { alert("追跡番号を入力してください。"); return false; }
    return true;
  }

  document.getElementById("yamatoBtn").addEventListener("click", () => {
    if (!validate()) return;
    const n = input.value.trim();
    openUrl(`http://jizen.kuronekoyamato.co.jp/jizen/servlet/crjz.b.NQ0010?id=${encodeURIComponent(n)}`);
    addToHistory(n);
  });
  document.getElementById("sagawaBtn").addEventListener("click", () => {
    if (!validate()) return;
    const n = input.value.trim();
    openUrl(`http://k2k.sagawa-exp.co.jp/p/web/okurijosearch.do?okurijoNo=${encodeURIComponent(n)}`);
    addToHistory(n);
  });
  document.getElementById("jpPostBtn").addEventListener("click", () => {
    if (!validate()) return;
    const n = input.value.trim();
    openUrl(`http://tracking.post.japanpost.jp/service/singleSearch.do?searchKind=S002&locale=ja&reqCodeNo1=${encodeURIComponent(n)}`);
    addToHistory(n);
  });
  document.getElementById("universalBtn").addEventListener("click", () => {
    if (!validate()) return;
    const n = input.value.trim();
    openUrl(`https://parcelsapp.com/en/tracking/${encodeURIComponent(n)}`);
    addToHistory(n);
  });
  document.getElementById("aliexpressBtn").addEventListener("click", () => {
    if (!validate()) return;
    const n = input.value.trim();
    openUrl(`https://global.cainiao.com/newDetail.htm?mailNoList=${encodeURIComponent(n)}&otherMailNoList=`);
    addToHistory(n);
  });

  renderHistory();
</script>
</body>
</html>
